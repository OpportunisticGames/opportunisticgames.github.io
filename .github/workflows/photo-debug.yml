name: Debug a player photo

# Looks one or more players up the way the photo finder does and prints every request and answer, so a missing photo can
# be explained. Run by hand from the Actions tab: names separated by | (e.g. Mark Viduka|Nigel Martyn). Saves nothing.
on:
  workflow_dispatch:
    inputs:
      names:
        description: 'Player names, separated by |'
        required: false
        default: ''
  push:
    branches: ['claude/**']
    paths: ['goal-machine/tools/debug_names.txt']   # edit that file (one name per line) to run it on a feature branch

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Look the players up, loudly
        env:
          INPUT_NAMES: ${{ inputs.names }}
        run: |
          NAMES="$INPUT_NAMES"
          [ -z "$NAMES" ] && NAMES=$(paste -sd'|' goal-machine/tools/debug_names.txt)
          DEBUG_NAMES="$NAMES" python goal-machine/tools/fetch_photos.py
